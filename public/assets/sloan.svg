<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c4033"/>
      <stop offset="100%" stop-color="#3d2817"/>
    </linearGradient>
    <linearGradient id="slothBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a8c7b"/>
      <stop offset="100%" stop-color="#736655"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Branch -->
  <path d="M 10 70 Q 100 85 190 60" fill="none" stroke="url(#branchGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M 170 58 Q 185 40 195 45 Q 190 65 170 58 Z" fill="url(#leafGrad)"/>
  <path d="M 30 72 Q 40 55 55 58 Q 45 76 30 72 Z" fill="url(#leafGrad)"/>

  <!-- Sloth Hanging Body -->
  <!-- Back Arm -->
  <path d="M 50 78 Q 65 110 90 115" fill="none" stroke="#736655" stroke-width="13" stroke-linecap="round"/>
  <!-- Claws left -->
  <path d="M 45 74 Q 50 66 55 74" fill="none" stroke="#e0d6c8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 74 Q 55 66 60 74" fill="none" stroke="#e0d6c8" stroke-width="3" stroke-linecap="round"/>

  <!-- Back Leg -->
  <path d="M 150 70 Q 135 110 110 115" fill="none" stroke="#736655" stroke-width="13" stroke-linecap="round"/>
  <!-- Claws right -->
  <path d="M 145 66 Q 150 58 155 66" fill="none" stroke="#e0d6c8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 150 66 Q 155 58 160 66" fill="none" stroke="#e0d6c8" stroke-width="3" stroke-linecap="round"/>

  <!-- Torso -->
  <ellipse cx="100" cy="118" rx="34" ry="24" fill="url(#slothBody)"/>

  <!-- Front Arm -->
  <path d="M 58 78 Q 72 118 95 122" fill="none" stroke="#9a8c7b" stroke-width="12" stroke-linecap="round"/>
  <!-- Front Leg -->
  <path d="M 142 70 Q 128 118 105 122" fill="none" stroke="#9a8c7b" stroke-width="12" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="85" cy="142" r="22" fill="#8c7d6c"/>
  <!-- Face mask (Cream) -->
  <ellipse cx="85" cy="144" rx="16" ry="14" fill="#f4ebd9"/>
  
  <!-- Sloth eye patches -->
  <ellipse cx="78" cy="143" rx="5" ry="3.5" fill="#4d3e33" transform="rotate(-15 78 143)"/>
  <ellipse cx="92" cy="143" rx="5" ry="3.5" fill="#4d3e33" transform="rotate(15 92 143)"/>

  <!-- Closed sleepy eyes (happy crescents) -->
  <path d="M 75 143 Q 78 147 81 143" fill="none" stroke="#1f1813" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 89 143 Q 92 147 95 143" fill="none" stroke="#1f1813" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Snout & Nose -->
  <ellipse cx="85" cy="151" rx="3" ry="2" fill="#2d221c"/>
  <path d="M 83 154 Q 85 156 87 154" fill="none" stroke="#2d221c" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Cozy Headphones for ambient soundscapes -->
  <path d="M 64 140 A 22 22 0 0 1 106 140" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="62" y="136" width="6" height="13" rx="3" fill="#f59e0b" filter="url(#glow)"/>
  <rect x="102" y="136" width="6" height="13" rx="3" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Zzz floating particles -->
  <text x="120" y="145" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" fill="#10b981" opacity="0.9">Z</text>
  <text x="132" y="132" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" fill="#34d399" opacity="0.8">z</text>
  <text x="146" y="118" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#6ee7b7" opacity="0.7">z</text>
</svg>
